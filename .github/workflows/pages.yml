# Paskelbia galeriją per GitHub Pages kiekvieną kartą, kai pakeitimai patenka į „main“.
# Pakeliui automatiškai sumažina nuotraukas ir paverčia jas WebP (npm run photos).
# Kad veiktų: Settings → Pages → Build and deployment → Source: „GitHub Actions“.
name: Paskelbti galeriją

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run photos
      - name: Surinkti svetainės failus
        run: |
          mkdir _site
          cp -r index.html photos.json css js fonts optimized _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
