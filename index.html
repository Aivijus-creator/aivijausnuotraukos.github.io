<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="color-scheme" content="dark">
  <title>aivijaus.raw</title>
  <meta name="description" content="aivijaus.raw – gamtos fotografija. Nuotraukos sukasi spirale, o fonas nusidažo jų spalvomis.">
  <meta property="og:title" content="aivijaus.raw">
  <meta property="og:description" content="Gamtos fotografija. Nuotraukos sukasi spirale, o fonas nusidažo jų spalvomis.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070606'/%3E%3Cpath d='M16 16c0-3 2.4-5.4 5.4-5.4M16 16c3 0 6.8 2.8 6.8 7.2M16 16c0 4-4 8.4-9.6 8.4M16 16c-5 0-10.4-5-10.4-11.6' fill='none' stroke='%23ece8df' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/megrim-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="photos.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="stage" id="stage">
    <canvas class="ambient" id="ambient" aria-hidden="true"></canvas>
    <div class="veil" aria-hidden="true"></div>
    <canvas class="spiral" id="spiral" tabindex="0" role="application"
            aria-label="Nuotraukų spiralė. Rodyklėmis keiskite nuotrauką, Enter – atidaryti per visą ekraną."></canvas>
    <h1 class="brand" id="brand"></h1>
    <p class="counter" id="counter" aria-hidden="true"></p>
    <p class="place" id="place" aria-hidden="true">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14.5s4.5-4.2 4.5-8A4.5 4.5 0 0 0 3.5 6.5c0 3.8 4.5 8 4.5 8z"/><circle cx="8" cy="6.4" r="1.5"/></svg>
      <span id="place-text"></span>
    </p>
    <p class="hint" id="hint">Sukite, kad naršytumėte</p>
    <button class="still" id="still" type="button" aria-pressed="false" aria-label="Sustabdyti judesį">
      <svg class="still__pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5v9M10.5 3.5v9"/></svg>
      <svg class="still__play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2l7.5 4.8L5 12.8z"/></svg>
    </button>
    <p class="sr-only" id="live" aria-live="polite"></p>
  </main>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Nuotraukos peržiūra" tabindex="-1" hidden>
    <div class="viewer__backdrop"></div>
    <div class="viewer__stage"></div>
    <button class="viewer__btn viewer__close" type="button" aria-label="Uždaryti">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
    <button class="viewer__btn viewer__nav viewer__nav--prev" type="button" aria-label="Ankstesnė nuotrauka">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg>
    </button>
    <button class="viewer__btn viewer__nav viewer__nav--next" type="button" aria-label="Kita nuotrauka">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
    </button>
    <div class="viewer__caption" hidden>
      <h2 class="viewer__title"></h2>
      <p class="viewer__meta"></p>
      <p class="viewer__desc"></p>
    </div>
  </div>

  <noscript><p class="noscript">Šiai galerijai reikia įjungto „JavaScript“.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
